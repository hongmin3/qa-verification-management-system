# QA 자동화 플랫폼 — 통합 nginx 사이트 (한 호스트, 하나의 진입점)
#
#   http://<host>/               → 핵심 앱 (FastAPI + Jinja2, 127.0.0.1:24357)
#   http://<host>/manual-hub/    → QA Manual Hub SPA (정적 파일)
#   http://<host>/manual-hub/api → QA Manual Hub 백엔드 (127.0.0.1:9180)
#
# 홈 화면의 "매뉴얼 서버" 카드가 /manual-hub/ 를 열기 때문에 두 서비스가 같은
# origin 에 있어야 한다(쿠키·CORS 문제 없음). 두 서비스는 여전히 각자의 프로세스와
# 각자의 DB(SQLite / PostgreSQL)를 사용하는 독립 배포 단위다 — nginx 만 공유한다.
#
# 적용 절차:
#   1. Manual Hub 프론트엔드를 서브패스로 빌드한다
#        cd services/qa-manual-hub/frontend
#        VITE_BASE_PATH=/manual-hub/ npm run build
#   2. Manual Hub 백엔드 .env 에 SESSION_COOKIE_PATH=/manual-hub/ 를 넣는다
#      (세션 쿠키가 핵심 앱 요청에까지 실려 가지 않도록 범위를 좁힌다)
#   3. install.sh 는 SKIP_NGINX=1 로 실행하고 이 파일을 대신 배치한다
#        sudo SKIP_NGINX=1 ./services/qa-manual-hub/deploy/scripts/install.sh
#        sudo cp deploy/nginx/qa-platform.conf /etc/nginx/sites-available/qa-platform
#        sudo ln -sf /etc/nginx/sites-available/qa-platform /etc/nginx/sites-enabled/
#        sudo nginx -t && sudo systemctl reload nginx
#
# 이 서버에 이미 다른 서비스의 nginx 사이트가 있다면 그 파일을 수정하지 말고, 이
# 파일의 location 블록만 해당 server 블록에 옮겨 붙인다.
#
# HTTPS: 2026-09-02에 self-signed 인증서로 적용했다가, 브라우저의 "안전하지 않음" 경고가
# 실제 사용성 문제라 같은 날 롤백했다. 정식 CA 인증서(또는 사내 CA)를 발급받기 전에는
# 평문 HTTP로 운영한다. 재적용하려면 git log에서 이 롤백 이전 커밋을 참고할 것 — 그때도
# `sudo ufw allow 443/tcp`를 반드시 같이 해야 한다(안 하면 외부 접속이 막힌다).

# 이 포트는 config.yaml 의 app.port 와 **반드시 같아야 한다**. nginx 는 YAML 을 읽지
# 못하므로 여기만 자동으로 따라오지 않는다. 어긋나면 tests/test_serve_bind.py 가
# 실패한다 (앱은 새 포트에 뜨고 nginx 는 옛 포트로 프록시해 502 가 된다).
upstream qa_verification_app {
    server 127.0.0.1:24357;
    keepalive 16;
}

upstream qa_manual_hub_backend {
    server 127.0.0.1:9180;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;

    # 사내 DNS 를 등록하기 전에는 서버 IP 로 바로 접속할 수 있도록 `_` 를 남겨 둔다.
    server_name __SERVER_NAME__ _;

    # Manual Hub 의 MAX_UPLOAD_MB 이상이어야 한다. 여기서 먼저 거절하면 사용자는
    # 앱의 한국어 메시지 대신 nginx 기본 413 페이지를 보게 된다.
    client_max_body_size 512M;
    client_body_timeout 300s;

    proxy_connect_timeout 30s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;

    access_log /var/log/nginx/qa-platform.access.log;
    error_log  /var/log/nginx/qa-platform.error.log;

    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ------------------------------------------------------------------ #
    # QA Manual Hub (하위 서비스)
    # ------------------------------------------------------------------ #

    # /manual-hub 로 들어오면 SPA 의 base 와 맞도록 슬래시를 붙여 준다.
    location = /manual-hub {
        return 301 /manual-hub/;
    }

    # 백엔드는 자기 경로를 그대로(/api/...) 알고 있으므로 여기서 prefix 를 벗겨
    # 전달한다. 백엔드 코드는 서브패스 배포를 몰라도 된다.
    location /manual-hub/api/ {
        proxy_pass http://qa_manual_hub_backend/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /manual-hub;
        proxy_set_header Connection "";

        # 수백 MB PDF 스트리밍 다운로드/업로드를 디스크에 먼저 받지 않는다.
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # Vite 가 content hash 파일명을 쓰므로 강하게 캐시해도 안전하다.
    location /manual-hub/assets/ {
        alias /opt/qa-manual-hub/app/frontend/assets/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html 은 절대 캐시하지 않는다. 캐시되면 배포 후에도 옛 번들이 남는다.
    location = /manual-hub/index.html {
        alias /opt/qa-manual-hub/app/frontend/index.html;
        add_header Cache-Control "no-store, must-revalidate";
        expires -1;
    }

    # SPA client-side routing: 없는 경로는 SPA 셸로 떨어뜨린다.
    location /manual-hub/ {
        alias /opt/qa-manual-hub/app/frontend/;
        try_files $uri $uri/ /manual-hub/index.html;
    }

    # 2026-09-02: 단독 배포 시절 주소 호환 블록 제거함 — 핵심 앱 라우터 전체를
    # 확인해 /products, /documents, /search, /recent, /users, /categories,
    # /audit, /settings, /account, /login, /api/ 와 겹치는 경로가 없음을
    # 확인했다. 통합 전 주소를 직접 북마크/캐시해둔 사용자가 있다면 이제 404다.

    # ------------------------------------------------------------------ #
    # 핵심 앱 (Regression 영향 분석 / 매뉴얼 개정 검증 / Knowledge)
    # ------------------------------------------------------------------ #
    location / {
        proxy_pass http://qa_verification_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # 분석 진행 상태를 SSE 로 흘려보내므로 버퍼링을 켜면 화면이 멈춘 것처럼 보인다.
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
