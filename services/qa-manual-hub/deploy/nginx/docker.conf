# QA Manual Hub -- nginx site for the Docker Compose stack (web container).
#
# Same behaviour as deploy/nginx/qa-manual-hub.conf, with the backend reached by
# its compose service name.  Mounted as /etc/nginx/conf.d/default.conf.

upstream qa_manual_hub_backend {
    server backend:9180;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    # Must be >= MAX_UPLOAD_MB, or nginx rejects the upload with an opaque 413.
    client_max_body_size 512M;
    client_body_timeout 300s;
    client_body_buffer_size 1m;

    proxy_connect_timeout 30s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;

    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy same-origin always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # --- API -------------------------------------------------------------- #
    location /api/ {
        proxy_pass http://qa_manual_hub_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # The audit log trusts X-Real-IP (set here from the socket peer), not the
        # first X-Forwarded-For value, which a browser can write itself.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_request_buffering off;
    }

    # --- SPA static assets ------------------------------------------------ #
    root /usr/share/nginx/html;
    index index.html;

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
        expires -1;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
