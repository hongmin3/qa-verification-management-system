# QA Manual Hub -- nginx site
#
# Single entry point on port 80.  Serves the built SPA as static files and
# reverse-proxies /api to the uvicorn unit on 127.0.0.1:24358.
#
# HTTPS later: add a `listen 443 ssl;` server block, point ssl_certificate at
# the internal certificate, redirect 80 -> 443, and set SESSION_COOKIE_SECURE=true
# in /opt/qa-manual-hub/.env.  Nothing else in this file has to change.

upstream qa_manual_hub_backend {
    server 127.0.0.1:24358;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;

    # install.sh substitutes SERVER_NAME here.  The trailing `_` keeps this the
    # default server, so the site answers on the host's bare IP too -- useful
    # before the DNS record exists, and as a permanent fallback.
    server_name __SERVER_NAME__ _;

    # Must be >= MAX_UPLOAD_MB in .env, or nginx rejects the upload before the
    # application ever sees it and the user gets an opaque 413.
    client_max_body_size 512M;
    client_body_timeout 300s;
    client_body_buffer_size 1m;

    # Large manuals take a while to move; give the proxy room.
    proxy_connect_timeout 30s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;

    access_log /var/log/nginx/qa-manual-hub.access.log;
    error_log  /var/log/nginx/qa-manual-hub.error.log;

    # Do not advertise the exact nginx build.
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy same-origin always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # --- API -------------------------------------------------------------- #
    location /api/ {
        proxy_pass http://qa_manual_hub_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Streaming downloads of multi-hundred-MB PDFs must not be buffered to
        # disk first.
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # --- SPA static assets ------------------------------------------------ #
    root /opt/qa-manual-hub/app/frontend;
    index index.html;

    # Vite emits content-hashed file names, so these are safe to cache hard.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html itself must never be cached, or a deploy leaves clients on the
    # old bundle.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
        expires -1;
    }

    # Client-side routing: unknown paths fall through to the SPA shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
