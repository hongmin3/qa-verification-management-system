# VXvue 제품의 지식 동기화 설정. 이 파일은 제품 마스터 데이터(SQLite products 테이블)를
# 대체하지 않는다 — "이 제품을 어떻게 동기화할지"만 담는다.
#
# 새 제품을 추가하려면 이 파일을 복사해 경로만 바꾸면 된다. 코드 변경은 필요하지 않다
# (docs/PRODUCT_ONBOARDING.md).
product: VXvue
version: "1.0"
manual_types:
  - "VXvue Service Manual"
  - "VXvue Operation Manual"
  - "VXvue DICOM Conformance Statement"
  - "System Integration Guide for VXvue"
  - "VXvue Web System Design & API Protocol Manual"

# QA가 이 제품의 사양서·매뉴얼·TC·QA 규칙 최신본을 모아 두는 폴더. 앱은 읽기만 하고
# 프로젝트 안(data/product_knowledge/<slug>/)으로 사본과 정규화 텍스트를 수집한다.
# 분류는 파일명 규약으로 하므로 제품별 코드 분기가 없다 — 규약이 다른 제품만 classify를 덮어쓴다.
# 담당자 PC 와 운영 서버가 같은 폴더를 다른 경로로 본다 (PC 는 로컬 경로, 서버는 마운트 지점).
# `${ENV:-기본값}` 은 환경변수가 있으면 그것을, 없으면 기본값을 쓴다 — 서버에서만
# QA_KNOWLEDGE_DIR_VXVUE 를 설정하면 되고 PC 는 아무것도 하지 않아도 된다.
# 서버 설정: /etc/systemd/system/<유닛>.d/override.conf 의 Environment= 또는 .env
knowledge_source:
  dir: "${QA_KNOWLEDGE_DIR_VXVUE:-C:/Users/2024980/Documents/자동화/projects/vxvue/VXvue 지식파일}"
  # 지식 폴더에 함께 두지만 이 시스템의 지식 자산이 아닌 파일. 수집하지 않는다.
  # polarion_query_backup.pdf 는 Polarion 이슈 조회 결과를 묶은 보고서 PDF 로, 파일명 규약의 어느
  # 종류에도 속하지 않는다. 이 시스템은 이슈를 issue_source.export_dir 에서 읽는다.
  ignore:
    - "polarion_query_backup*"

specification:
  # alm_crawler: 별도 프로젝트 ALM-QA-Automation 의 srs-spec 앱이 Polarion에서 이미 수집한 PDF를 읽기만 한다.
  source: alm_crawler
  # 그 앱의 output 폴더(output/<날짜>/pdf/). 그 프로젝트의 코드/설정은 건드리지 않고 이 경로만 읽는다.
  crawler_output_dir: "C:/Users/2024980/Documents/자동화/projects/ALM-QA-Automation/apps/srs-spec/output"
  filename_patterns:
    - "(사양서) VXvue 사양서*.pdf"
    - "(사양서) Licence Manager SRS 사양서*.pdf"

testcase:
  # TC는 Knowledge 화면에서 수동 등록하거나 knowledge_source 폴더에서 수집한다.
  source: manual

# Polarion Issue Export 산출물. 별도 프로젝트 ALM-QA-Automation 의 issue-export 앱이 REST API로
# 수집해 <실행폴더>/<ISSUE-ID>/backup.json 을 만든다 (예전에는 <ISSUE-ID>/backup.json 바로 아래).
# 그 결과물만 읽는다. 같은 Issue 가 여러 실행에 있으면 가장 최근 실행 폴더의 것을 쓴다.
issue_source:
  source: alm_issue_export
  export_dir: "C:/Users/2024980/Documents/자동화/projects/ALM-QA-Automation/apps/issue-export/polarion_backup"
  id_prefix: "VP"

sync:
  # ALM-QA-Automation 의 평일 통합 수집(ALM_QA_Automation_Daily, 평일 09:00 KST)보다 40분 늦게
  # 실행해 수집이 끝날 시간을 확보한다. 이 PC 의 작업 스케줄러 AIRegressionAnalyzer_VXvueSpecSync 도
  # 같은 시각(평일 09:40)이다. 사양서가 바뀌지 않았으면 다시 올리지 않는다.
  day_of_week: "mon-fri"
  schedule_time: "09:40"

# ALM(Polarion) 프로젝트와 필드 대응 (SPEC REQ-QAINTEL-002). QA Intelligence 엔진은 여기 적힌 원본
# 필드 이름만 읽고, 공통 모델(id·title·rd_result·occurrence_cause…)로 바꾼 뒤에는 원본 이름을 모른다.
# 적지 않은 공통 필드는 Polarion 표준 필드 이름(id, title, status, severity, description, created, updated)을 쓴다.
alm:
  project_id: "VXvue"
  queries:
    srs: "type:srs"
    # 이슈 전체를 읽어 이슈 스냅샷으로 비교한다 (REQ-QAINTEL-004). 신규 여부는 스냅샷 비교로 정한다.
    issue: "type:issue"
  fields:
    srs:
      legacy_id: oldId
      # 한국어 본문이 없으면 description 을 쓴다.
      description: [descriptionKR, description]
      is_category: isCategory
    issue:
      rd_result: rndReviewResult
      reproduction_step: reproductionStep
      occurrence_cause: occurrenceCause
      action_details: actionDetails
  relations:
    occurred_versions: occurredVersion
    target_versions: targetVersion
    linked_items: linkedWorkItems
    comments: comments
  # 연구소 검토 결과 원본 값 → 공통 값. 공통 엔진은 오른쪽 값만 안다.
  rd_result_mapping:
    lab_fixed: FIXED
    lab_inspec: SPEC
    lab_nobug: NOT_BUG
    lab_duplicate: DUPLICATE
    lab_pending: PENDING
    lab_noact: NO_ACTION

# QA Intelligence Agent 제품 설정 (specs/qa-intelligence.md).
qa_intelligence:
  enabled: true
  rules:
    # 제품 규칙 Skill(config/products/vxvue/skills/vxvue-qa-rules)이 기준으로 삼는 QA 규칙 판.
    # Skill 을 새 판에 맞춰 검토·수정한 뒤에만 올린다 (REQ-DAILY-010).
    supported_rev: "1.17"
    product_skill: "vxvue-qa-rules"
  # 수정 완료 이슈 분석의 Regression 축. GENERATOR(X-ray Generator 조건)는 VXvue 제품에만 있다.
  regression_axes: [DIRECT, STATE, DATA, PERSISTENCE, INTEGRATION, PERMISSION, PRIOR_ISSUE, GENERATOR]
  checklist:
    # 지식 사본의 "(TC) R-20-643_VXvue_변경사항 영향성평가_Checklist.xlsx" 가 초안 Excel 의 본보기다.
    template_name_contains: "영향성평가"
    category: "Changes Checklist"
    headers: ["Category", "TC ID", "버전", "SRS No", "변경사항", "변경사항 상세", "Title", "Precondition", "Test Step", "Expected Result", "Test Data"]
