# Copy to .github/workflows/project-readiness.yml after reviewing project-specific CI.
# This uses the project's managed checker; it does not require the parent workspace.
name: Project readiness
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check project documents and requirement traceability
        run: node .project-check/project-readiness.js . --template .project-check/agents-spec-section.md
