[pytest]
# 이 저장소는 배포 단위가 두 개다(핵심 앱 / services/*). 루트에서 `pytest` 를 실행하면
# 핵심 앱 테스트만 수집한다 — 하위 서비스는 각자의 런타임 의존성(예: Manual Hub는
# 실제 PostgreSQL)이 필요하므로 자기 디렉터리에서 따로 실행한다.
#   핵심 앱          : pytest                      (루트)
#   QA Manual Hub    : pytest tests               (services/qa-manual-hub/backend)
testpaths = tests

# 수집 패턴을 기본값 `test*` 보다 엄격하게 둔다. `testcase_payload` 처럼 도메인 용어가
# `test` 로 시작하는 함수를 pytest 가 테스트로 오인해 "fixture 'cases' not found" 로
# 실패하는 일이 실제로 있었다. 이 저장소의 테스트는 전부 `test_` 접두사를 쓴다.
python_functions = test_*
python_classes = Test_*
