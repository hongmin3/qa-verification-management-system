app:
  name: "QA 검증 관리 시스템"
  host: "0.0.0.0"
  # 이 앱이 listen 하는 포트의 **단일 원본**이다. 여기만 고치면 uvicorn 바인딩과
  # 앱이 자기 자신을 부르는 URL, 운영 점검(scripts/monitor_health.py)이 모두 따라간다
  # (app/serve.py, app/core/config.py 의 app_bind/app_self_url).
  # 따라오지 않는 곳은 nginx 뿐이다 — deploy/nginx/qa-platform.conf 의 upstream 포트는
  # 손으로 맞춰야 하고, 어긋나면 tests/test_serve_bind.py 가 실패시킨다.
  port: 24357

storage:
  # DB 는 data/app.db 로 고정이다(app/core/storage.py, scripts/backup_data.py).
  upload_dir: "data/uploads"
  specification_dir: "data/specifications"
  testcase_dir: "data/testcases"
  index_dir: "data/indexes"
  report_dir: "output/reports"
  export_dir: "output/exports"
  generated_tc_dir: "output/generated_tc"
  log_dir: "output/logs"
  manual_revision_dir: "data/manual_revisions"
  manual_review_comment_dir: "output/manual_review_comments"
  # 매뉴얼 서버에서 내려받은 Current 매뉴얼의 로컬 사본 (원본이 아니라 대조용 사본)
  manual_hub_cache_dir: "data/manual_hub_cache"

# 이 저장소가 함께 관리하는 하위 서비스. 핵심 앱과 다른 프로세스·다른 DB를 쓰는
# 독립 배포 단위이므로, 홈 화면에서는 링크로만 연결한다 (services/ 참고).
services:
  manual_hub:
    name: "매뉴얼 서버"
    description: "제품 매뉴얼·기술문서의 Revision 이력을 삭제 없이 보존하는 사내 문서관리 시스템입니다."
    # 홈 화면 카드가 여는 주소. 빈 문자열이면 카드를 표시하지 않는다.
    # 기본값은 같은 서버 nginx가 /manual-hub/ 로 프록시하는 통합 배포 기준이다
    # (deploy/nginx/qa-platform.conf). 별도 호스트로 운영하면 절대 URL을 넣는다.
    url: "/manual-hub/"
    # 핵심 앱이 매뉴얼 서버 API를 호출할 주소. 통합 배포에서는 같은 호스트의 nginx가
    # /manual-hub/api 를 매뉴얼 서버 백엔드로 프록시하므로 127.0.0.1로 충분하다
    # (외부로 나가지 않는다). 매뉴얼 서버를 다른 호스트에 두면 그 주소를 넣는다.
    #
    # 자격증명은 secrets.txt의 MANUAL_HUB_USER / MANUAL_HUB_PASSWORD에서 읽는다.
    # 이 주소와 자격증명 둘 다 있어야 연동이 켜지고, 하나라도 없으면 꺼진 채
    # 기존 동작을 그대로 유지한다. secrets.txt는 배포되지 않으므로 서버에서 직접 넣는다.
    api_url: "http://127.0.0.1/manual-hub/api"

# 오래된 파일 자동 정리 (app/core/retention.py). scripts/backup_data.py 가 새 백업을 검증한 뒤 실행한다.
# 값은 보관 일수이고 0 이면 그 종류는 지우지 않는다. 일일 QA 스냅샷(data/daily_qa/snapshots/)은 지우지 않는다.
retention:
  backup_days: 30                   # 백업 ZIP. 가장 새 백업 하나는 날짜와 관계없이 남긴다.
  ai_cache_days: 180                # AI 응답 저장본(ai_cache). 지워도 같은 요청이 오면 다시 부른다.
  daily_qa_run_days: 365            # 일일 QA 실행 폴더(output/daily_qa/<실행 번호>/)
  daily_qa_workspace_run_days: 30   # 일일 QA 작업 폴더의 실행 입력(<작업 폴더>/runs/<실행 번호>/)

manual_review:
  # 근거 SRS 후보 개수 상한 (토큰 절약, 스펙 §28-G)
  max_srs_candidates: 6

retrieval:
  engine: "bm25"
  specification_top_k: 8
  candidate_limit: 150
  # 사용자 요청 사항이 있을 때, 변경 문서 전체 대신 BM25로 이 줄 수만큼만 추려 Gemini에 보낸다
  # (토큰 절약). 문서가 이보다 짧으면 그대로 전체를 사용한다.
  change_text_top_lines: 60

analysis:
  recommended_confidence: 0.80
  review_confidence: 0.60
  max_retries: 3
  retry_min_seconds: 1
  retry_max_seconds: 10
  cache_enabled: true
  # 0 = 비활성. Gemini 무료 한도를 유지하려면 https://aistudio.google.com 할당량을 확인해
  # 하루 총 토큰 수 기준으로 값을 넣는다. 넘으면 새 분석 실행이 차단된다 (실행 중인 분석에는 영향 없음).
  daily_token_limit: 0
  # 단일 uvicorn 프로세스에서 동시에 실행할 분석 수. 초과 요청은 429로 거절한다.
  max_concurrent_jobs: 2
  # 이 시간 동안 단계 갱신이 없는 RUNNING 작업은 운영 모니터에서 stale 경고한다.
  job_timeout_minutes: 30

# 외부로 나가는 문자열의 마스킹 (app/core/security_filter.py). RAG를 쓴다고 외부 전송이
# 0이 되는 것은 아니므로, Gemini 호출 직전에 개인정보·사내 경로를 자리표로 바꾼다.
# QA 판단에 필요한 식별자(SRS/Issue ID, DICOM Tag, Command 번호, 버전, ErrorCode)는 그대로 둔다.
security:
  mask_outbound: true

# 요청 난이도에 따른 모델 선택 (app/core/model_router.py). 난이도 판정에 LLM을 쓰지 않고
# 입력에서 세어지는 신호(근거 문서 수, Root Cause 명시 여부, 연동 용어 포함)로만 고른다.
#
# 아래 값은 **이 계정에서 실제 호출해 확인한 것**이다 (2026-09-08).
#   gemini-2.5-pro       404 — 신규 계정에 제공되지 않는다. 결제와 무관하다.
#   gemini-2.5-flash-lite 404 — 같은 이유.
#   gemini-3.1-pro-preview / gemini-pro-latest
#                        thinking 을 끌 수 없다 ("Budget 0 is invalid. This model only
#                        works in thinking mode"). 이 프로젝트는 thinking_budget=0 이
#                        전제이므로 맞지 않는다 — 설정하면 코드가 thinking 을 켜서 다시
#                        부르지만 사소한 프롬프트에도 thought 토큰이 수백~1만 개 붙는다.
#
# 같은 Issue·같은 입력으로 비교한 결과 (scripts/compare_models.py, Issue 2건·3회 실행):
#
#   gemini-2.5-flash        out 5.3~5.6K / thought 0      / 24~26초
#     TC 후보 40건을 전부 판정하면서 **judgment 필드에 관련도 값(NOT_RELATED/RELATED)을
#     넣는다.** 스키마 혼동이라 검증 계층이 전부 SPEC_REVIEW 로 강등한다 → TC 판정이
#     사실상 쓸 수 없다. 2개 Issue 에서 재현됐다.
#   gemini-3.1-pro-preview  out 5.3K / thought 10.0K / 111초
#     thinking 을 끌 수 없다. 근거가 하나도 없는데 40건을 전부 KEEP 으로 단정했다 —
#     "문제 없다"는 오판이라 가장 위험하다. 느리고 비싸고 결과가 더 나빴다.
#   gemini-3.5-flash        out 2.2~2.3K / thought 0      / 10~11초
#     관련 TC 2~3건만 선별해 유효한 값(KEEP/MUST_UPDATE)으로 판정한다.
#     출력 58% 적고 2.4배 빠르고 46% 저렴하다.
#
# 그래서 standard·complex 모두 gemini-3.5-flash 로 둔다. Pro 계열은 이 업무에 맞지 않는다 —
# 이 파이프라인의 LLM 작업은 사전 압축된 근거에 대한 구조화 판정이라 내부 추론이 필요 없고,
# thinking 토큰은 출력 예산을 함께 소비해 JSON 이 잘린다.
#
# 두 등급이 같은 모델이어도 라우팅 판정(tier·이유)은 결과에 기록된다 — 나중에 상위 등급을
# 바꿀 때 어떤 케이스가 complex 로 분류됐는지 근거가 남는다.
# 사례가 쌓이면 compare_models.py 로 다시 확인한다.
# Regression 영향 분석·QA Agent·매뉴얼 개정 검증이 판정을 받을 AI (SPEC REQ-AICALL-005).
#   claude_cli : Claude CLI(`claude -p`)를 회사 Team 계정으로 부른다 (기본값)
#   gemini     : Gemini API 를 부른다. 아래 models.* 와 GEMINI_API_KEY 를 쓴다
# 서버는 secrets.txt 의 CLAUDE_CODE_OAUTH_TOKEN 으로 인증하고, 개발 PC 는 기존 로그인을 쓴다.
ai:
  provider: "claude_cli"
  claude:
    # Claude CLI 실행 파일. PATH 에 있으면 이름만 둔다.
    command: "claude"
    # 호출 한 번의 제한 시간(초). 넘으면 그 분석만 실패한다 (다시 시도하지 않는다).
    timeout_seconds: 600
    # 빈 작업 폴더. 반드시 저장소 밖이고 상위 폴더에 CLAUDE.md/AGENTS.md 가 없어야 한다.
    # 빈 값이면 사용자 홈의 ~/.qa-ai-workspace 를 쓴다.
    workdir: ""
    # 추론 정도 (low / medium / high / xhigh / max). 빈 값이면 CLI 기본값.
    effort: ""
    # 모델 등급별 모델 (app/core/model_router.py). 사용량 한도에 자주 닿으면
    # claude-sonnet-5-5 로 낮춘다.
    models:
      light: "claude-opus-5-5"
      standard: "claude-opus-5-5"
      complex: "claude-opus-5-5"

# ai.provider 가 gemini 일 때만 쓰는 Gemini 모델 등급.
models:
  light: "gemini-3.1-flash-lite"
  standard: "gemini-3.5-flash"
  complex: "gemini-3.5-flash"
  # 1M 토큰당 USD. 값이 바뀌면 여기만 고친다 (코드에 하드코딩하지 않는다).
  # 비용은 추정치이고 실제 청구는 Google 콘솔이 기준이다.
  # gemini-3.x 단가는 공식 표를 확인해 채운다 — 아래는 2.5-flash 기준 잠정값이다.
  pricing:
    gemini-3.1-flash-lite:
      input: 0.10
      output: 0.40
    gemini-2.5-flash:
      input: 0.30
      output: 2.50
    gemini-3.5-flash:
      input: 0.30
      output: 2.50
    gemini-3.1-pro-preview:
      input: 1.25
      output: 10.00

qa_agent:
  # 호출 1회에 주입할 QA 규칙 발췌 상한 (문자). 규칙 전문은 약 30KB이고 대부분 무관하다.
  rule_char_budget: 5000
  # AI에 보낼 TC 후보 상한. 전체 TC(제품당 수천 건)를 보내지 않는다.
  tc_candidate_limit: 40
  # 모델 등급을 고정하려면 light / standard / complex 중 하나를 넣는다. 빈 값이면 자동 선택.
  force_model_tier: ""

# 운영 알림 (app/core/notifier.py). 앱이 스스로 복구할 수 없고 사람이 조치해야 끝나는
# 상황만 메일로 알린다 — 지금은 Gemini 할당량·결제 문제와 모델 사용 불가.
# 수신자와 SMTP 자격증명은 secrets.txt 에 둔다 (공개 저장소에 개인 메일을 커밋하지 않는다):
#   NOTIFY_EMAIL_TO=받는사람@example.com
#   SMTP_USER=보내는계정@gmail.com
#   SMTP_PASSWORD=앱비밀번호        # Gmail 은 2단계 인증 후 "앱 비밀번호"를 발급해 쓴다
# 셋 중 하나라도 없으면 알림이 꺼진 채로 동작한다 (분석에는 영향 없음).
notifications:
  email:
    enabled: true
    # Gmail 기준. 사내 SMTP 서버가 있으면 그 주소로 바꾼다.
    host: "smtp.gmail.com"
    port: 587
    use_tls: true
    # 비우면 SMTP_USER 를 발신자로 쓴다.
    sender: ""
    # 같은 문제로 이 시간 안에는 다시 보내지 않는다. 크레딧이 소진되면 실행마다 같은
    # 오류가 나므로 쿨다운이 없으면 메일이 폭주한다.
    cooldown_minutes: 180

# VXvue 일일 QA 점검 (app/modules/daily_qa, SPEC REQ-DAILY-*). 앱 내장 스케줄러가 아래 시각에
# scripts/run_daily_qa.py 를 분리된 별도 프로세스로 띄운다 (점검 자체는 웹 프로세스 밖에서 돈다).
# Polarion·Claude 자격증명이 없는 호스트(개발 PC)에서는 시각에 깨어나도 건너뛴다.
# 비밀값(POLARION_HOST, POLARION_TOKEN, CLAUDE_CODE_OAUTH_TOKEN, DAILY_QA_EMAIL_TO)은 secrets.txt 에 둔다.
daily_qa:
  enabled: true
  # 제품 목록이 없을 때의 제품, 개편 전 기록(product 빈 값)의 제품.
  product: "VXvue"
  # 예약·대시보드에 올릴 제품 목록. 제품마다 config/products/<slug>.yaml 의 alm·qa_intelligence 가 있어야 한다.
  # 비우면 product 하나만 돈다. 예: products: ["VXvue", "Bellalun Viewer"]
  # products: ["VXvue"]
  # ALM-QA-Automation 사양서 자동화의 과거 SRS 스냅샷 (scripts/import_alm_srs_history.py, REQ-QAINTEL-029).
  # 그 도구가 있는 PC 에서만 쓴다. 서버에는 가져온 결과(data/daily_qa/snapshots/<slug>/srs/)를 둔다.
  alm_history:
    # 상대 경로는 이 프로젝트 폴더 기준이다(워크스페이스의 이웃 프로젝트).
    srs_snapshot_dir: "../ALM-QA-Automation/apps/srs-spec/snapshots"
  schedule:
    day_of_week: "mon-fri"
    time: "07:30"
    # 공휴일(config/holidays/kr.yaml)에는 예약 실행을 건너뛴다. 회사 휴무일은 extra_holidays 에 더한다.
    skip_holidays: true
    # extra_holidays: ["2026-05-01"]
  # Claude 가 읽고 쓰는 격리 폴더. **반드시 저장소 밖**이어야 한다 (NFR-SEC-001).
  # 저장소 안이면 저장소의 개발용 CLAUDE.md/AGENTS.md 가 함께 읽혀 실행이 거부된다.
  # 빈 값이면 사용자 홈의 ~/.qa-daily-workspace 를 쓴다.
  workspace_dir: ""
  # Claude CLI 실행 파일. PATH 에 있으면 이름만 둔다.
  claude_command: "claude"
  # 작업 하나(입력 묶음 하나)당 제한 시간(초). 넘으면 그 작업만 실패로 남는다.
  task_timeout_seconds: 900
  # 한 실행에서 AI 에 보낼 작업 묶음 수 상한 (비용·시간 보호).
  max_tasks_per_run: 30
  # 묶음 하나에 넣을 항목 수 (SRS 변경 / 이슈).
  batch_size: 5
  # B 에서 SRS 하나당 AI 에 보낼 TC 후보 상한.
  tc_candidate_limit: 15
  # 추적 공백(E)·매뉴얼 누락(F)을 도는 요일 (mon~sun).
  weekly_day: "mon"
  polarion:
    project_id: "VXvue"
    # 조회식은 제품 설정(config/products/<slug>.yaml 의 alm.queries)이 먼저다. srs_query·issue_query 는 제품 설정에
    # 조회식이 없을 때만 쓴다. 이슈는 전체를 읽어 스냅샷으로 비교하므로 좁히지 않는다 (REQ-QAINTEL-004).
    srs_query: "type:srs"
    issue_query: "type:issue"
    verify_ssl: true
    timeout_seconds: 90
    page_size: 100
    request_interval_seconds: 0.15
  # 메일에 넣을 실행 상세 주소의 앞부분 (예: http://서버주소). 비우면 경로(/qa-agent/runs/<실행 ID>)만 적는다.
  review_base_url: ""
  # 후보 압축·댓글·재시도·한도 catch-up (specs/qa-intelligence.md). 적지 않으면 아래 기본값을 쓴다.
  # intelligence:
  #   comment_fetch_limit: 300     # 한 실행에서 댓글을 읽을 이슈 수 상한. 넘은 이슈는 다음 실행에
  #   comment_min_chars: 15        # 이보다 짧은 댓글은 의미 없는 댓글로 본다
  #   event_max_attempts: 3        # 같은 이벤트 분석이 이 횟수만큼 실패하면 포기(abandoned)
  #   catchup_max_hours: 12        # 세션 한도 초기화가 이 시간 안이면 초기화 뒤 한 번 다시 돈다
  #   catchup_delay_minutes: 5
  #   use_knowledge_documents: true  # 등록된 사양서 문서 조각도 후보로 찾는다
